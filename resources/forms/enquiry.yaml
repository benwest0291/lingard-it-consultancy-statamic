title: enquiry
fields:
  - handle: first_name
    field:
      type: text
      display: First Name
      validate: required
  - handle: last_name
    field:
      type: text
      display: Last Name
      validate: required
  - handle: company
    field:
      type: text
      display: Company
  - handle: email
    field:
      type: text
      input_type: email
      display: Email
      validate: required|email
  - handle: contact_number
    field:
      type: text
      display: Contact Number
  - handle: message
    field:
      type: textarea
      display: Message
      validate: required
