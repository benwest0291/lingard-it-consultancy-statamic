title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: pages_replicator
            field:
              type: replicator
              display: 'Pages Replicator'
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    masthead:
                      display: Masthead
                      icon: align-object-top
                      fields:
                        -
                          import: masthead
                          prefix: masthead_
                    banner:
                      display: Banner
                      icon: align-object-top
                      fields:
                        -
                          import: banner
                          prefix: banner_
                    breadcrumbs:
                      display: Breadcrumbs
                      icon: dots
                      fields:
                        -
                          import: breadcrumbs
                    text_body:
                      display: 'Text Body'
                      icon: fieldtype-textarea
                      fields:
                        -
                          import: text_body
                          prefix: text_body_
                    frequently_asked_questions:
                      display: 'Frequently Asked Questions'
                      icon: tabs-sections
                      fields:
                        -
                          import: frequently_asked_questions
                          prefix: faq_
                    thank_you:
                      display: 'Thank You'
                      icon: chart-monitoring-indicator
                      fields:
                        -
                          import: thank_you
                          prefix: thank_you_
                    call_to_action:
                      display: 'Call To Action'
                      icon: layout-carousel-horizontal
                      fields:
                        -
                          import: call_to_action
                          prefix: call_to_action_
                    text_and_image:
                      display: 'Text And Image'
                      icon: text-formatting-image-right
                      fields:
                        -
                          import: text_and_image
                          prefix: text_and_image_
                    testimonials:
                      display: Testimonials
                      icon: quote
                      fields:
                        -
                          import: testimonials
                          prefix: testimonials_
                    values:
                      display: Values
                      icon: star
                      fields:
                        -
                          import: values
                          prefix: values_
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
