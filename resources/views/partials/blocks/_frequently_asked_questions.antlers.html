<section class="px-2 lg:px-4 py-12 bg-black">
    <div class="container mx-auto">
        {{ if faq_heading }}
            <h2 class="font-manrope text-white text-3xl mb-10 font-bold text-center">{{ faq_heading }}</h2>
        {{ /if }}

        {{ faq_bars }}
            <div class="w-full mb-3">
                <div class="bg-white-opacity rounded-4xl border border-white-opacity p-5 cursor-pointer"
                    x-data="{ open: {{ index == 0 ? 'true' : 'false' }} }"
                    @click="open = !open">

                    <div class="flex justify-between items-center">
                        <h2 class="font-manrope text-white text-lg font-semibold pr-4">{{ question }}</h2>
                        <i class="fa-solid fa-chevron-down transition-transform duration-300 text-lg flex-shrink-0"
                            :class="open ? 'rotate-180 text-orange' : 'text-white'"></i>
                    </div>

                    <div
                        x-show="open"
                        x-transition:enter="transition ease-out duration-200"
                        x-transition:enter-start="opacity-0 -translate-y-1"
                        x-transition:enter-end="opacity-100 translate-y-0"
                        x-transition:leave="transition ease-in duration-150"
                        x-transition:leave-start="opacity-100 translate-y-0"
                        x-transition:leave-end="opacity-0 -translate-y-1"
                        @click.stop>
                        <div class="text-md text-white mt-4 font-inter">
                            {{ answer }}
                        </div>
                    </div>
                </div>
            </div>
        {{ /faq_bars }}
    </div>
</section>
